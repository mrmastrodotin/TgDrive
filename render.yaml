services:
  - type: web
    name: tgdrive
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_CHANNEL_ID
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /app/data/tgdrive.db
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGIN
        value: "*"
